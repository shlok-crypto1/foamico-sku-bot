<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --key-black:#1A1A1A; --kiwi:#95C12B; --avocado:#3F5E12; --calm:#E4F2C5;
    --sand:#9D9E9E; --egg:#FEFEFE; --charcoal:#2B2B2B; --slate:#6B6B6B;
    --light-grey:#DDDDDD; --mist:#F2F4EC; --paper:#F6F8F1;
    --head:"Montserrat","Calibri",Arial,sans-serif;
    --body:"Poppins","Calibri",Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--body);color:var(--slate);background:var(--mist);line-height:1.6;
    -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}
  .wrap{max-width:1020px;margin:0 auto;padding:22px 18px 80px}

  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
  .kicker{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.16em;
    color:var(--avocado);font-size:10.5px;margin:0}
  .wordmark{font-family:var(--head);font-weight:800;font-size:28px;color:var(--key-black);
    letter-spacing:-.5px;line-height:1;display:inline-flex;align-items:center;margin-top:6px}
  .wordmark .dot{width:10px;height:10px;border-radius:3px;background:var(--kiwi);
    display:inline-block;margin-left:5px;transform:translateY(2px)}

  /* language toggle */
  .lang{display:inline-flex;border:1px solid var(--light-grey);border-radius:999px;overflow:hidden;
    background:var(--egg);flex:none}
  .lang button{font-family:var(--head);font-weight:700;font-size:12px;border:none;cursor:pointer;
    padding:7px 14px;background:transparent;color:var(--slate)}
  .lang button.on{background:var(--kiwi);color:var(--key-black)}

  h1{font-family:var(--head);font-weight:700;color:var(--key-black);font-size:19px;margin:12px 0 2px}
  .sub{font-size:13px;color:var(--slate);margin:0 0 20px;max-width:640px}

  .card{background:var(--egg);border:1px solid var(--light-grey);border-radius:14px;padding:18px;margin-bottom:20px}
  .card h2{font-family:var(--head);font-weight:700;font-size:12.5px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--avocado);margin:0 0 12px}

  textarea{width:100%;min-height:150px;resize:vertical;font-family:var(--mono);font-size:13.5px;
    color:var(--key-black);background:var(--paper);border:1px solid var(--light-grey);border-radius:10px;
    padding:14px 16px;line-height:1.7}
  textarea:focus{outline:none;border-color:var(--kiwi);box-shadow:0 0 0 3px var(--calm)}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .btn{font-family:var(--head);font-weight:700;font-size:14px;border:none;cursor:pointer;
    border-radius:999px;padding:12px 26px;transition:transform .05s ease,filter .15s ease}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--kiwi);color:var(--key-black)}
  .btn-primary:hover{filter:brightness(1.04)}
  .btn-ghost{background:transparent;color:var(--slate);border:1px solid var(--light-grey);font-weight:600}
  .btn-ghost:hover{background:var(--paper)}
  .btn-mic{display:inline-flex;align-items:center;gap:8px;padding:12px 20px}
  .btn-mic svg{width:18px;height:18px;fill:currentColor;flex:none}

function wordsToNumbers(s){
  const words=s.split(/\s+/),out=[];
  for(let i=0;i<words.length;i++){
    const key=words[i].toLowerCase().replace(/[.,]/g,'');
    if(EN_TENS.has(key)&&i+1<words.length){
      const next=words[i+1].toLowerCase().replace(/[.,]/g,'');
      if(DIRECT_NUMBERS[next]>0&&DIRECT_NUMBERS[next]<10){out.push(String(DIRECT_NUMBERS[key]+DIRECT_NUMBERS[next]));i++;continue;}
    }
    out.push(Object.prototype.hasOwnProperty.call(DIRECT_NUMBERS,key)?String(DIRECT_NUMBERS[key]):words[i]);
  }
  return out.join(' ');
}
function normalize(line){
  let s=line;
  s=s.replace(/[०-९]/g,d=>HINDI_DIGITS[d]);      // Hindi digits -> 0-9
  DEVA_MAP.forEach(([re,rep])=>{ s=s.replace(re,rep); });
  s=s.replace(/\bby\b/gi,' x ');
  s=wordsToNumbers(s).replace(/(\d)\s*(?:inches|inch|ins|in)\b/gi,'$1 '); // drop inch units, keep the number
  return s.replace(/\s+/g,' ').trim();
}

/* ===== parsing (operates on normalised text) ===== */
function parseQty(line,size){
  let work=line,m;
  if(size)work=line.slice(0,size.index)+' '.repeat(size.len)+line.slice(size.index+size.len);
  const patterns=[
    /(?:^|\s)(?:x|×|\*|@|qty\.?|quantity)\s*(\d{1,3})(?:\s*(?:pcs?|nos?\.?|units?|pieces?|sets?))?(?=\s|$)/i,
    /(?:^|\s)(\d{1,3})\s*(?:pcs?|nos?\.?|units?|pieces?|sets?)\b/i,
    /(?:^|\s)(\d{1,3})\s*(?:x|×)(?=\s|$)/i
  ];
  for(const pattern of patterns)if((m=work.match(pattern)))break;
  if(!m){
    const suffix=size?line.slice(size.index+size.len):line;
    const bare=size?suffix.match(/^\s*(\d{1,3})\s*$/):suffix.match(/(?:^|\s)(\d{1,3})\s*$/);
    if(bare){
      const start=size?size.index+size.len:bare.index;
      m={0:suffix,index:start-(size?size.index+size.len:0),1:bare[1],bare:true,start};
    }
  }
  if(!m)return{qty:1,work};
  const qty=Math.max(1,+m[1]||1);
  if(m.bare)work=line.slice(0,m.start)+' '.repeat(m[0].length)+line.slice(m.start+m[0].length);
  else work=work.slice(0,m.index)+' '.repeat(m[0].length)+work.slice(m.index+m[0].length);

}

/* all standard dimension values that appear anywhere in the price sheet, e.g. [30,36,42,48,60,66,72,75,78,84] */
const STD_SIZES=[...new Set(Object.keys(PRICES).flatMap(k=>k.split('x').map(Number)))].sort((a,b)=>a-b);
/* odd size not in the sheet: find the smallest standard (a',b') pair with a'>=a, b'>=b that exists in PRICES */
function findUpgrade(a,b){
  const aC=STD_SIZES.filter(s=>s>=a),bC=STD_SIZES.filter(s=>s>=b);
  let best=null;
  for(const av of aC)for(const bv of bC){
    const key=stdKey(av,bv);
    if(key&&(!best||(av+bv)<best.sum))best={key,sum:av+bv};
  }

}
/* resolve a size (possibly odd) to a price: exact catalog match, else upgrade to next standard size, else per-sq-ft */
function priceForSize(a,b,col){
  const key=stdKey(a,b);
  if(key)return{sizeLabel:key.replace('x','×'),custom:false,upgraded:false,unit:PRICES[key][col.i]};
  const up=findUpgrade(a,b);
  if(up)return{sizeLabel:up.key.replace('x','×'),custom:false,upgraded:true,origSize:a+'×'+b,unit:PRICES[up.key][col.i]};
  const sqin=a*b,sqft=sqin/144,unit=Math.round(sqft*col.r);

function parseModel(l){l=l.toLowerCase();for(const m of MODELS)if(l.includes(m.toLowerCase()))return m;return null;}
function parseVariant(l){l=l.toLowerCase();let m;

function parseThickness(w){const valid=[4,4.5,5,6,6.5,7,8,9,10];const re=/(\d{1,2}(?:\.\d)?)/g;
  let mm;while((mm=re.exec(w))!==null){const f=parseFloat(mm[1]);if(valid.includes(f))return f;}return null;}

function matchLine(raw){

  let tWork=quantity.work;
  if(size)tWork=tWork.slice(0,size.index)+'  '+tWork.slice(size.index+size.len);
  const model=parseModel(line);
  if(!model){
    for(const p of PILLOWS)if(p.re.test(line))
      return{kind:'pillow',src:raw.trim(),ok:true,name:p.name,cat:p.cat,qty,unit:p.mrp,total:p.mrp*qty};

  const variant=parseVariant(line);

}

}
function renderList(){
  const t=T[LANG],w=document.getElementById('listWrap');
  if(!items.length){w.innerHTML='<div class="li-empty">'+t.listEmpty+'</div>';return;}
  w.innerHTML=items.map((r,idx)=>{
    const label=r.kind==='pillow'?r.name+' ('+r.cat+')':skuLabel(r,t.inches)+(r.custom?' · '+t.custom:r.upgraded?' · '+t.upgraded:'');
    return '<div class="li-item"><div class="li-main"><span class="q">'+r.qty+'×</span>'+esc(label)+'</div>'+
           '<button class="li-rm" data-idx="'+idx+'" aria-label="remove">✕</button></div>';
  }).join('');
  w.querySelectorAll('.li-rm').forEach(b=>b.addEventListener('click',()=>{items.splice(+b.dataset.idx,1);renderList();draw(items);}));
}
function applyLang(){
  const t=T[LANG];
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(t[k])el.textContent=t[k];});
  document.getElementById('en').classList.toggle('on',LANG==='en');
  document.getElementById('hi').classList.toggle('on',LANG==='hi');
  document.getElementById('bSize').placeholder=t.sizePh;
  const pm=document.getElementById('bModel').value,pt=document.getElementById('bThk').value;
  buildModelSelect();
  if(pm){document.getElementById('bModel').value=pm;
    if(pm.slice(0,2)==='m:'){buildThkSelect(pm.slice(2),pt);document.getElementById('bThk').disabled=false;document.getElementById('bSize').disabled=false;}
    else if(pm.slice(0,2)==='p:'){document.getElementById('bThk').innerHTML='<option>'+t.fixedPrice+'</option>';document.getElementById('bThk').disabled=true;document.getElementById('bSize').disabled=true;}}
  renderList();draw(items);
}

function draw(rows){
  const t=T[LANG],out=document.getElementById('output'),copyBtn=document.getElementById('copy');
  if(!rows||rows.length===0){out.innerHTML='<div class="empty">'+t.emptyNone+'</div>';copyBtn.classList.add('hidden');return;}
  let grand=0,items=0,flagged=0,body='';
  rows.forEach(r=>{
    if(r.ok){
      grand+=r.total;items+=r.qty;let interp;
      if(r.kind==='pillow'){
        interp='<span class="skuline"><strong>'+esc(r.name)+'</strong> ('+esc(r.cat)+')</span>';
      }else{
        interp='<span class="skuline"><strong>'+esc(r.model)+'</strong> '+
               esc(r.variant+' '+r.sizeLabel+', '+r.thickness+' '+t.inches)+'</span>'+
               (r.custom?'<span class="tag custom">'+t.custom+'</span>':r.upgraded?'<span class="tag upgraded">'+t.upgraded+'</span>':'');
      }
      const note=r.custom?'<div class="note">'+esc(t.calc(r.sizeLabel.split('×')[0],r.sizeLabel.split('×')[1],r.sqin,r.sqft,r.rate,r.unit))+'</div>':
        r.upgraded?'<div class="note">'+esc(t.upgradeNote(r.origSize,r.sizeLabel))+'</div>':'';
      body+='<tr><td><div class="tags">'+interp+'</div>'+note+'</td>'+
            '<td class="num">'+r.qty+'</td><td class="num">₹'+inr(r.unit)+'</td>'+
            '<td class="num price-strong">₹'+inr(r.total)+'</td></tr>';
    }else{
      flagged++;const M=t.msg;let msg;
      if(r.msgKey==='ambiguous')msg=M.ambiguous(r.opts);
      else if(r.msgKey==='askVariant')msg=M.askVariant(r.model,r.thickDisp,r.opts);
      else if(r.msgKey==='askThickness')msg=M.askThickness(r.model,r.variant,r.opts);
      else msg=M[r.msgKey];
      body+='<tr class="flag"><td><div class="src">'+esc(r.src)+'</div><div class="tags"><span class="flagtag">'+
            t.needTag+'</span></div><div class="asknote">'+esc(msg)+'</div></td>'+
            '<td class="num">—</td><td class="num">—</td><td class="num">—</td></tr>';
    }
  });
  let html='<table><thead><tr><th>'+t.thPill+'</th><th class="num">'+t.thQty+'</th><th class="num">'+
    t.thUnit+'</th><th class="num">'+t.thTotal+'</th></tr></thead><tbody>'+body+'</tbody></table>';
  html+='<div class="total-bar"><div><div class="lbl">'+t.grand+'</div><div class="total-meta">'+
    items+' '+(items!==1?t.items:t.item)+' '+t.priced+(flagged?' · '+flagged+' '+t.need:'')+
    '</div></div><div class="amt"><span class="k">₹</span>'+inr(grand)+'</div></div>';
  out.innerHTML=html;copyBtn.classList.remove('hidden');
  // plain text copy
  let txt=t.copyTitle+'\n\n';
  rows.forEach(r=>{if(r.ok){const d=r.kind==='pillow'?r.name+' ('+r.cat+')':
      skuLabel(r,t.inches)+(r.custom?' ['+t.custom+']':r.upgraded?' ['+t.upgraded+' '+r.origSize+'→'+r.sizeLabel+']':'');
    txt+=`${r.qty} × ${d}  @ ₹${inr(r.unit)}  = ₹${inr(r.total)}\n`;}
    else{const M=t.msg;let msg;
      if(r.msgKey==='ambiguous')msg=M.ambiguous(r.opts);
      else if(r.msgKey==='askVariant')msg=M.askVariant(r.model,r.thickDisp,r.opts);
      else if(r.msgKey==='askThickness')msg=M.askThickness(r.model,r.variant,r.opts);
      else msg=M[r.msgKey];
      txt+=`[${t.needTag}] ${r.src} — ${msg}\n`;}});
  txt+=`\n${t.grand}: ₹${inr(grand)}  (${items} ${items!==1?t.items:t.item})`;
  copyBtn.dataset.txt=txt;
}

/* ================= wire ================= */
document.getElementById('bModel').addEventListener('change',onModelChange);
document.getElementById('bAdd').addEventListener('click',addItem);
document.getElementById('bSize').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addItem();}});
document.getElementById('bQty').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addItem();}});
document.getElementById('clear').addEventListener('click',()=>{
  items=[];renderList();draw(items);clearErr();
  document.getElementById('bSize').value='';document.getElementById('bQty').value='1';
});
document.getElementById('copy').addEventListener('click',e=>{const b=e.currentTarget;
  navigator.clipboard.writeText(b.dataset.txt||'').then(()=>{b.textContent=T[LANG].copied;
    setTimeout(()=>b.textContent=T[LANG].copy,1400);});});
function changeLanguage(lang){LANG=lang;applyLang();}
document.getElementById('en').addEventListener('click',()=>changeLanguage('en'));
document.getElementById('hi').addEventListener('click',()=>changeLanguage('hi'));

applyLang();
</script>
</body>
</html>
